<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard de Clientes</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<script src="dm-logo.js"></script>
<style>
:root{
 --bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#697386;--accent:#2359d1;
 --ok:#087552;--okbg:#e2f6ef;--danger:#b42318;--dangerbg:#fee4e2;
 --warn:#9a5b00;--warnbg:#fff1d6;--info:#175cd3;--infobg:#eaf2ff;--line:#e2e7ef
}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#12213f;color:#fff;padding:12px 24px;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:72px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}
header h1{font-size:20px;margin:0}header small{opacity:.78}.wrap{max-width:1720px;margin:auto;padding:20px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px;padding-bottom:3px}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:650;color:#44506a}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.notice{display:none;background:#fff1d6;border:1px solid #efcf8a;color:#72430a;padding:12px;border-radius:10px;margin-bottom:12px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select,.toolbar button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;font-size:13px}
.toolbar input{min-width:280px;flex:1}.toolbar button{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;cursor:pointer}.toolbar button.secondary{background:#fff;color:var(--accent)}.toolbar button:disabled{opacity:.55;cursor:wait}
.cards{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:11px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.card span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.card b{display:block;font-size:24px;margin-top:5px}
.content{display:grid;grid-template-columns:390px 1fr;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.panel h2{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.map{height:570px;position:relative;background:linear-gradient(150deg,#eef5ff,#fbfdff);overflow:hidden}
.portugal{position:absolute;left:78px;top:25px;width:220px;height:510px;background:#dce7fa;clip-path:polygon(35% 0,75% 3%,88% 13%,80% 29%,91% 46%,73% 62%,78% 79%,62% 100%,24% 96%,18% 81%,29% 67%,15% 50%,27% 31%,20% 14%)}
.dot{position:absolute;transform:translate(-50%,-50%);min-width:34px;height:34px;border:0;border-radius:18px;background:#2359d1;color:#fff;font-size:10px;font-weight:800;cursor:pointer;padding:0 7px}.dot.zero{opacity:.25}.dot.active{outline:4px solid #2359d133}
.maplabel{position:absolute;font-size:9px;color:#39465f;transform:translate(18px,-5px);white-space:nowrap}
.legend{position:absolute;left:10px;bottom:10px;background:#ffffffdc;padding:8px;border-radius:9px;font-size:10px}
.tablewrap{max-height:570px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{position:sticky;top:0;background:#f7f9fc;z-index:2;text-align:left;font-size:10px;text-transform:uppercase;color:#59657a}th,td{padding:10px 11px;border-bottom:1px solid var(--line)}tr.data:hover{background:#f1f6ff;cursor:pointer}
.status{display:inline-block;padding:4px 8px;margin:1px 3px 1px 0;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}.inactive{background:var(--dangerbg);color:var(--danger)}.sales,.existing{background:var(--infobg);color:var(--info)}.nosales{background:#eef0f4;color:#606877}.new{background:var(--okbg);color:var(--ok)}.possible{background:var(--warnbg);color:var(--warn)}
.side{position:fixed;right:-500px;top:0;width:470px;max-width:95vw;height:100vh;background:#fff;z-index:60;box-shadow:-10px 0 30px #17203333;transition:.25s;padding:24px;overflow:auto}.side.open{right:0}.close{float:right;border:0;background:#eef1f6;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}.overlay{display:none;position:fixed;inset:0;background:#10182866;z-index:50}.overlay.open{display:block}.field{padding:11px 0;border-bottom:1px solid var(--line)}.field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.empty{padding:35px;text-align:center;color:var(--muted)}.filemeta{font-size:11px;color:var(--muted);margin-left:8px}
@media(max-width:1150px){.cards{grid-template-columns:repeat(3,1fr)}.content{grid-template-columns:1fr}}
@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:11px}.toolbar input{min-width:100%}}
</style>
</head>
<body>
<header><div class="brand"><img id="dmLogo" alt="DM"><div><h1>Dashboard de Clientes</h1><small>Base, vendas e comparações independentes</small></div></div><small id="stamp">A carregar…</small></header>
<main class="wrap">
<div id="notice" class="notice"></div>
<div id="tabs" class="tabs"></div>
<div class="toolbar">
 <input id="search" placeholder="Pesquisar nome, NIF, email, código ou localidade">
 <select id="district"><option value="">Todos os distritos</option></select>
 <select id="activity">
   <option value="active">Ativos apenas</option>
   <option value="all">Ativos e inativos</option>
   <option value="inactive">Inativos apenas</option>
 </select>
 <select id="state"><option value="">Todos os estados</option></select>
 <button id="exportExcel" class="secondary">Exportar Excel</button>
 <button id="exportPdf" class="secondary">Exportar PDF</button>
 <button id="reload">Atualizar dados</button>
</div>
<div id="cards" class="cards"></div>
<div class="content">
 <section class="panel"><h2 id="mapTitle">Mapa</h2><div id="map" class="map"><div class="portugal"></div><div id="legend" class="legend"></div></div></section>
 <section class="panel"><h2 id="listTitle">Registos</h2><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>NIF</th><th>Distrito</th><th>Estado</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</div>
</main>
<div id="overlay" class="overlay" onclick="closeSide()"></div><aside id="side" class="side"><button class="close" onclick="closeSide()">×</button><div id="detail"></div></aside>
<script>
const FILES={clientes:"dados/clientes.xlsx",vendas:"dados/vendas.xlsx",manifest:"dados/importados/manifest.json"};
const positions={"VIANA DO CASTELO":[18,5],"BRAGA":[37,8],"VILA REAL":[60,12],"BRAGANCA":[80,9],"PORTO":[34,20],"AVEIRO":[31,33],"VISEU":[52,31],"GUARDA":[72,30],"COIMBRA":[40,43],"CASTELO BRANCO":[66,46],"LEIRIA":[33,54],"SANTAREM":[49,58],"LISBOA":[29,68],"PORTALEGRE":[69,62],"SETUBAL":[39,76],"EVORA":[62,75],"BEJA":[57,87],"FARO":[54,97],"ACORES":[8,88],"MADEIRA":[15,97],"SEM DISTRITO":[88,94]};
let base=[], importedSets=[], current="base", selectedDistrict="", forceReload=false, searchTimer=null, uidIndex=new Map(), lastFiltered=[], renderLimit=400;
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat("pt-PT").format(n||0),clean=v=>String(v??"").trim();
const esc=v=>clean(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const norm=v=>clean(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const nif=v=>clean(v).replace(/\D/g,"").replace(/^0+(?=\d{9}$)/,"");
function district(v){let x=clean(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();return {"BRAGANÇA":"BRAGANCA","SANTARÉM":"SANTAREM","ÉVORA":"EVORA","AÇORES":"ACORES","FUNCHAL":"MADEIRA"}[x]||x||"SEM DISTRITO"}
function value(row,names){const keys=Object.keys(row);for(const n of names){const k=keys.find(k=>norm(k)===norm(n));if(k!==undefined&&clean(row[k])!=="")return row[k]}return""}
async function loadBuffer(url,force=false){const target=force?url+(url.includes("?")?"&":"?")+"v="+Date.now():url;const r=await fetch(target,{cache:force?"no-store":"default"});if(!r.ok)throw new Error("Falha ao ler "+url);return r.arrayBuffer()}
function chooseImportedSheet(wb){
 const preferredHeaders=["NIF","ENTIDADE","NOME DA FIRMA","COMPANY","NOMBRE COMERCIAL (Nome Comercial)","VAT Number"];
 let best=null,bestScore=-1;
 for(const sheetName of wb.SheetNames){
  const ws=wb.Sheets[sheetName];
  const preview=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false,range:0,blankrows:false}).slice(0,15);
  for(let rowIndex=0;rowIndex<preview.length;rowIndex++){
   const headers=(preview[rowIndex]||[]).map(v=>norm(v));
   const score=preferredHeaders.reduce((n,h)=>n+(headers.includes(norm(h))?1:0),0);
   if(score>bestScore){bestScore=score;best={ws,sheetName,rowIndex}}
  }
 }
 return best&&bestScore>0?best:{ws:wb.Sheets[wb.SheetNames[0]],sheetName:wb.SheetNames[0],rowIndex:0};
}
async function loadRows(url,force=false){
 const buf=await loadBuffer(url,force),wb=XLSX.read(buf,{type:"array"});
 const selected=chooseImportedSheet(wb);
 return XLSX.utils.sheet_to_json(selected.ws,{defval:"",raw:false,range:selected.rowIndex,blankrows:false});
}
async function loadClients(){
 const buf=await loadBuffer(FILES.clientes,forceReload),wb=XLSX.read(buf,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],m=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
 const hi=m.findIndex(r=>r.some(v=>norm(v)==="CLIENTE")&&r.some(v=>norm(v)==="CONTRIB"));if(hi<0)throw new Error("Cabeçalho de clientes não encontrado");
 const h=m[hi].map(clean);return m.slice(hi+1).map((r,i)=>{const o={};h.forEach((x,j)=>{if(x)o[x]=r[j]??""});return{
  uid:"b"+i,code:clean(value(o,["Cliente"])),name:clean(value(o,["Nome"])),nif:nif(value(o,["Contrib.","Contribuinte","NIF"])),
  address:clean(value(o,["Morada"])),locality:clean(value(o,["Localidade"])),phone:clean(value(o,["Telefone"])),mobile:clean(value(o,["Telemóvel","Telemovel"])),
  email:clean(value(o,["E-Mail","Email"])),district:district(value(o,["Descrição [Zonas Geográficas]","Distrito"])),
  seller:clean(value(o,["Vendedor"])),group:clean(value(o,["Gr.Empresa","Grupo Empresa"])).toUpperCase(),source:"Listagem de clientes",isImported:false
 }}).filter(x=>x.code||x.name||x.nif)
}
function saleCodeKeys(v){
 const raw=clean(v),keys=new Set();
 if(!raw)return keys;
 keys.add(norm(raw));
 const first=raw.split(/\s*[-–—|/]\s*|\s{2,}/)[0];
 if(first)keys.add(norm(first));
 const numeric=raw.match(/\d+/);
 if(numeric)keys.add(String(Number(numeric[0])));
 const alphaNum=raw.match(/[A-Z]+\s*0*\d+|0*\d+\s*[A-Z]+/i);
 if(alphaNum)keys.add(norm(alphaNum[0]));
 return keys
}
function parseSales(rows){
 const codes=new Set,nifs=new Set,names=new Set;
 rows.forEach(r=>{
  const c=value(r,["CLIENTES","Cliente","Código Cliente","COD CLIENTE","COD. CLIENTE","CLIENTE RDS","RDS"]);
  saleCodeKeys(c).forEach(k=>codes.add(k));
  const normalizedName=norm(c);if(normalizedName)names.add(normalizedName);
  const n=nif(value(r,["CONTRIBUINTE","NIF","VAT Number","Nº CONTRIBUINTE"]));if(n)nifs.add(n)
 });
 return{codes,nifs,names}
}
function parseImported(rows,setId,label){
 return rows.map((r,i)=>({
  uid:setId+"_"+i,
  name:clean(value(r,["ENTIDADE","COMPANY POS","COMPANY","NOMBRE COMERCIAL (Nome Comercial)","NOME DA FIRMA","Nome","Cliente"])),
  legalName:clean(value(r,["ENTIDADE","COMPANY","NOME DA FIRMA"])),
  commercialName:clean(value(r,["ENTIDADE","NOMBRE COMERCIAL (Nome Comercial)","NOME DA FIRMA"])),
  code:clean(value(r,["B2B CODE","Código","Cliente","COOP.","Cliente Sage"])),
  nif:nif(value(r,["VAT Number","Contribuinte","NIF","NºCONT.","Nº CONT.","N CONT"])),
  email:clean(value(r,["CORREO GENERAL (E-mail Geral)","Email","E-Mail","E-MAIL"])),
  phone:clean(value(r,["TELEFONE1","TELEFONE2","Telefone","Phone","TELEFONE"])),
  address:clean(value(r,["Morada","MORADA"])),
  locality:clean(value(r,["LOCALIDAD (Localidade)","Localidade","LOCALIDADE"])),
  postalCode:clean(value(r,["CODIGO_POS","CP (Codigo Postal)","Código Postal","CP"])),
  district:district(value(r,["DISTRITO","PROVINCIA (Distrito)","Distrito"])),
  seller:clean(value(r,["REPRESENTANTE","Vendedor"])),
  source:label,isImported:true,setId
 })).filter(x=>x.name||x.nif||x.email||x.code)
}
function reconcile(sales){
 const byNif=new Map,byEmail=new Map,byName=new Map;
 base.forEach(c=>{c.inactive=c.group==="INA";const codeMatch=[...saleCodeKeys(c.code)].some(k=>sales.codes.has(k));const nameMatch=!!(c.name&&sales.names&&sales.names.has(norm(c.name)));c.hasSales=(c.nif&&sales.nifs.has(c.nif))||codeMatch||nameMatch;c.matchState=c.inactive?"inactive":c.hasSales?"sales":"nosales";if(c.nif&&!byNif.has(c.nif))byNif.set(c.nif,c);if(c.email&&!byEmail.has(norm(c.email)))byEmail.set(norm(c.email),c);if(c.name&&!byName.has(norm(c.name)))byName.set(norm(c.name),c)});
 importedSets.forEach(set=>set.rows.forEach(r=>{let m=null,s="";if(r.nif&&byNif.has(r.nif)){m=byNif.get(r.nif);s="existing"}else if(r.email&&byEmail.has(norm(r.email))){m=byEmail.get(norm(r.email));s="existing"}else if(r.name&&byName.has(norm(r.name))){m=byName.get(norm(r.name));s="existing"}else{const rn=norm(r.legalName||r.name);if(rn.length>7){m=base.find(c=>{const cn=norm(c.name);return cn.length>7&&(cn.includes(rn)||rn.includes(cn))})||null;if(m)s="possible"}}r.match=m;r.matchState=s||"new";r.hasSales=!!(m&&m.hasSales);r.inactive=!!(m&&m.inactive)}))
}
function makeSearchIndex(r){
 return norm([r.name,r.legalName,r.commercialName,r.nif,r.code,r.email,r.phone,r.mobile,r.address,r.postalCode,r.locality,r.district,r.seller,r.group,r.source].join(" "))
}
function prepareIndexes(){
 uidIndex=new Map();
 [...base,...importedSets.flatMap(x=>x.rows)].forEach(r=>{r.searchIndex=makeSearchIndex(r);uidIndex.set(r.uid,r)})
}
function currentSet(){return current==="base"?{id:"base",label:"Listagem de clientes",rows:base}:importedSets.find(x=>x.id===current)}
function statusHtml(r){if(!r.isImported){if(r.inactive)return'<span class="status inactive">Inativo</span>';return r.hasSales?'<span class="status sales">Com vendas</span>':'<span class="status nosales">Sem vendas</span>'}if(r.matchState==="new")return'<span class="status new">Cliente novo</span>';if(r.matchState==="possible")return'<span class="status possible">Possível correspondência</span>';return'<span class="status existing">Já é cliente</span>'+(r.inactive?'<span class="status inactive">Inativo</span>':r.hasSales?'<span class="status sales">Com vendas</span>':'<span class="status nosales">Sem vendas</span>')}
function statusText(r){if(!r.isImported)return r.inactive?"Inativo":r.hasSales?"Com vendas":"Sem vendas";if(r.matchState==="new")return"Cliente novo";if(r.matchState==="possible")return"Possível correspondência";return"Já é cliente - "+(r.inactive?"Inativo":r.hasSales?"Com vendas":"Sem vendas")} 
function configureFilters(set){
 $("activity").style.display=set.id==="base"?"":"none";
 $("state").innerHTML=set.id==="base"?'<option value="">Todos os estados</option><option value="sales">Com vendas</option><option value="nosales">Sem vendas</option><option value="inactive">Inativos</option>':'<option value="">Todos os estados</option><option value="existing">Já é cliente</option><option value="new">Cliente novo</option><option value="possible">Possível correspondência</option>';
 $("state").value="";
}
function filtered(){
 const set=currentSet(),q=norm($("search").value),st=$("state").value,act=$("activity").value;
 return set.rows.filter(r=>{if(selectedDistrict&&r.district!==selectedDistrict)return false;if(set.id==="base"){if(act==="active"&&r.inactive)return false;if(act==="inactive"&&!r.inactive)return false}if(st&&r.matchState!==st)return false;if(q&&!(r.searchIndex||"").includes(q))return false;return true})
}
function renderCards(set){
 let cards=[];
 if(set.id==="base"){const a=base.filter(x=>!x.inactive),ina=base.filter(x=>x.inactive);cards=[["Clientes ativos",a.length],["Clientes inativos",ina.length],["Ativos com vendas",a.filter(x=>x.hasSales).length],["Ativos sem vendas",a.filter(x=>!x.hasSales).length],["Distritos",new Set(a.map(x=>x.district)).size],["Total da base",base.length]]}
 else{const r=set.rows;cards=[["Total da lista",r.length],["Clientes com vendas",r.filter(x=>x.matchState==="existing"&&x.hasSales&&!x.inactive).length],["Clientes sem vendas",r.filter(x=>x.matchState==="existing"&&!x.hasSales&&!x.inactive).length],["Clientes novos",r.filter(x=>x.matchState==="new").length],["Possíveis correspondências",r.filter(x=>x.matchState==="possible").length],["Clientes inativos",r.filter(x=>x.matchState==="existing"&&x.inactive).length]]}
 $("cards").innerHTML=cards.map(x=>`<div class="card"><span>${esc(x[0])}</span><b>${fmt(x[1])}</b></div>`).join("")
}
function renderMap(rows,set){
 document.querySelectorAll(".dot,.maplabel").forEach(x=>x.remove());
 const counts={};rows.forEach(r=>counts[r.district]=(counts[r.district]||0)+1);
 Object.entries(positions).forEach(([d,p])=>{const n=counts[d]||0,b=document.createElement("button"),l=document.createElement("span");b.className="dot "+(n?"":"zero")+" "+(selectedDistrict===d?"active":"");b.style.left=p[0]+"%";b.style.top=p[1]+"%";b.textContent=fmt(n);b.title=d+": "+fmt(n);b.onclick=()=>{selectedDistrict=selectedDistrict===d?"":d;$("district").value=selectedDistrict;render()};l.className="maplabel";l.style.left=p[0]+"%";l.style.top=p[1]+"%";l.textContent=d;$("map").append(b,l)});
 $("mapTitle").innerHTML="Mapa — "+esc(set.label)+(set.id==="base"?' <span class="filemeta">base principal</span>':' <span class="filemeta">mapa independente</span>');
 $("legend").textContent=set.id==="base"?"Mapa exclusivo da listagem base.":"Mapa exclusivo deste ficheiro importado."
}
function fillDistricts(set){const vals=[...new Set(set.rows.map(r=>r.district).filter(Boolean))].sort();$("district").innerHTML='<option value="">Todos os distritos</option>'+vals.map(x=>`<option>${esc(x)}</option>`).join("");$("district").value=selectedDistrict}
function renderRows(rows){
 const shown=rows.slice(0,renderLimit);
 let html=shown.map(r=>`<tr class="data" onclick="showDetail('${r.uid}')"><td><b>${esc(r.name||"Sem nome")}</b><br><small>${esc(r.code||"")}</small></td><td>${esc(r.nif)}</td><td>${esc(r.district)}</td><td>${statusHtml(r)}</td></tr>`).join("");
 if(!html)html='<tr><td colspan="4" class="empty">Sem resultados</td></tr>';
 else if(rows.length>shown.length)html+=`<tr><td colspan="4" class="empty"><button class="btn" onclick="showMore()">Mostrar mais (${fmt(rows.length-shown.length)})</button></td></tr>`;
 $("tbody").innerHTML=html
}
function showMore(){renderLimit+=400;renderRows(lastFiltered)}
function render(){
 const set=currentSet(),rows=filtered();lastFiltered=rows;renderCards(set);renderMap(rows,set);renderRows(rows);
 $("listTitle").textContent=`${set.label} — ${fmt(rows.length)} registo(s)`;
}
function renderTabs(){
 $("tabs").innerHTML=[{id:"base",label:"Base de clientes"},...importedSets].map(x=>`<button class="tab ${x.id===current?"active":""}" onclick="selectTab('${x.id}')">${esc(x.label)}</button>`).join("")
}
function selectTab(id){current=id;selectedDistrict="";renderLimit=400;$("search").value="";renderTabs();const set=currentSet();configureFilters(set);fillDistricts(set);render()}
function showDetail(uid){
 const r=uidIndex.get(uid);if(!r)return;
 const match=r.match?`${r.match.name} (${r.match.code||r.match.nif})`:"";
 const fields=[["Código",r.code],["NIF",r.nif],["Nome legal",r.legalName],["Nome comercial",r.commercialName],["Email",r.email],["Telefone",r.phone],["Morada",r.address],["Código postal",r.postalCode],["Localidade",r.locality],["Distrito",r.district],["Vendedor",r.seller],["Grupo empresa",r.group],["Ficheiro de origem",r.source],["Correspondência na base",match]];
 $("detail").innerHTML=`<h2>${esc(r.name||"Sem nome")}</h2><p>${statusHtml(r)}</p>`+fields.filter(x=>clean(x[1])!=="").map(x=>`<div class="field"><label>${esc(x[0])}</label><div>${esc(x[1])}</div></div>`).join("");$("side").classList.add("open");$("overlay").classList.add("open")
}
function closeSide(){$("side").classList.remove("open");$("overlay").classList.remove("open")}
function exportRows(){return filtered().map(r=>({
 "Cliente":r.name||"", "Nome legal":r.legalName||"", "Nome comercial":r.commercialName||"", "Código":r.code||"", "NIF":r.nif||"",
 "Email":r.email||"", "Telefone":r.phone||r.mobile||"", "Morada":r.address||"", "Código postal":r.postalCode||"", "Localidade":r.locality||"",
 "Distrito":r.district||"", "Vendedor":r.seller||"", "Estado":statusText(r), "Correspondência na base":r.match?`${r.match.name} (${r.match.code||r.match.nif||""})`:"", "Origem":r.source||""
}))}
function safeFileName(v){return clean(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9_-]+/g,"_").replace(/^_+|_+$/g,"")||"clientes"}
function exportExcel(){const rows=exportRows();if(!rows.length)return alert("Não existem registos para exportar.");const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();ws["!cols"]=[{wch:30},{wch:28},{wch:28},{wch:12},{wch:14},{wch:28},{wch:16},{wch:35},{wch:14},{wch:22},{wch:18},{wch:20},{wch:28},{wch:38},{wch:24}];XLSX.utils.book_append_sheet(wb,ws,"Clientes");XLSX.writeFile(wb,safeFileName(currentSet().label)+"_"+new Date().toISOString().slice(0,10)+".xlsx")}
function exportPdf(){const rows=filtered();if(!rows.length)return alert("Não existem registos para exportar.");if(!window.jspdf||!window.jspdf.jsPDF)return alert("A biblioteca de PDF não foi carregada. Verifique a ligação à Internet.");const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});try{if(typeof LOGO_DM!=="undefined")doc.addImage(LOGO_DM,"JPEG",14,8,28,17)}catch(e){}doc.setFontSize(15);doc.text(currentSet().label,48,16);doc.setFontSize(9);doc.text("Exportado em "+new Date().toLocaleString("pt-PT")+" — "+rows.length+" registo(s)",48,22);doc.autoTable({startY:29,head:[["Cliente","Código","NIF","Distrito","Estado"]],body:rows.map(r=>[r.name||"",r.code||"",r.nif||"",r.district||"",statusText(r)]),styles:{fontSize:7,cellPadding:1.8,overflow:"linebreak"},headStyles:{fontStyle:"bold"},columnStyles:{0:{cellWidth:70},1:{cellWidth:24},2:{cellWidth:28},3:{cellWidth:35},4:{cellWidth:65}},didDrawPage:data=>{doc.setFontSize(7);doc.text("Página "+doc.internal.getNumberOfPages(),270,202)}});doc.save(safeFileName(currentSet().label)+"_"+new Date().toISOString().slice(0,10)+".pdf")}

async function loadAll(force=false){
 forceReload=force;$("reload").disabled=true;$("stamp").textContent="A carregar ficheiros…";$("notice").style.display="none";
 const errors=[];
 try{
   let salesRows=[];
   try{base=await loadClients()}catch(e){console.error(e);base=[];errors.push("clientes.xlsx: "+e.message)}
   try{salesRows=await loadRows(FILES.vendas,force)}catch(e){console.error(e);salesRows=[];errors.push("vendas.xlsx: "+e.message)}

   let manifest={files:[]};
   try{
     const manifestUrl=force?FILES.manifest+"?v="+Date.now():FILES.manifest;
     const manifestRes=await fetch(manifestUrl,{cache:force?"no-store":"default"});
     if(!manifestRes.ok)throw new Error("HTTP "+manifestRes.status);
     manifest=await manifestRes.json();
   }catch(e){console.error(e);errors.push("manifest.json: "+e.message)}

   importedSets=[];
   for(let i=0;i<(manifest.files||[]).length;i++){
     const f=manifest.files[i],label=f.label||f.name||("Ficheiro "+(i+1));
     $("stamp").textContent="A abrir "+label+"…";
     try{
       const rows=await loadRows(f.path,force);
       importedSets.push({id:"imp"+i,label,file:f.name,rows:parseImported(rows,"imp"+i,label)});
     }catch(e){console.error("Erro em",f.path,e);errors.push(label+": "+e.message)}
   }

   reconcile(parseSales(salesRows));prepareIndexes();renderLimit=400;renderTabs();
   const set=currentSet()||{id:"base",label:"Listagem de clientes",rows:base};
   if(!currentSet())current="base";
   configureFilters(set);fillDistricts(set);render();

   if(errors.length){
     $("notice").style.display="block";
     $("notice").innerHTML="<b>Alguns ficheiros não abriram:</b><br>"+errors.map(esc).join("<br>");
     $("stamp").textContent="Carregamento parcial";
   }else{$("stamp").textContent="Atualizado: "+new Date().toLocaleString("pt-PT")}
 }catch(e){
   console.error(e);$("notice").style.display="block";$("notice").innerHTML="<b>Erro inesperado:</b> "+esc(e.message);$("stamp").textContent="Erro";
 }finally{forceReload=false;$("reload").disabled=false}
}
if(typeof LOGO_DM!=="undefined")$("dmLogo").src=LOGO_DM;["activity","state"].forEach(id=>$(id).addEventListener("change",render));$("search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{renderLimit=400;render()},180)});$("district").addEventListener("change",e=>{selectedDistrict=e.target.value;render()});$("exportExcel").onclick=exportExcel;$("exportPdf").onclick=exportPdf;$("reload").onclick=()=>loadAll(true);loadAll(false);
</script>
